services:
  app:
    build: ./app
    environment:
      - DATA_PATH=/data/upwork_job.csv
    volumes:
      - ./data:/data:ro
    expose:
      - "5000"
    restart: unless-stopped

  web:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  notebook:
    build: ./notebook
    ports:
      - "8888:8888"
    volumes:
      - ./notebook:/work
      - ./data:/data:ro
